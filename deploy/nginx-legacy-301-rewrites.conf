# Legacy URL → SPA path (HTTP 301). Include inside nginx `server { ... }` BEFORE `location /` try_files:
#   include /FULL/PATH/TO/repo/deploy/nginx-legacy-301-rewrites.conf;
#
# Note: `?block=` / `?listing_type=` on `/properties` are not rewritten here (slugify needs app
# logic). The SPA replaces those with path-based URLs (`/properties/all/block-…`, etc.).
#
# Order: specific rules before wildcards.

rewrite ^/poperties/?(.*)$ /properties/$1 permanent;

rewrite ^/farmhouse-for-sale/?$ /properties/farm-house permanent;
rewrite ^/farmhouses-for-sale/?$ /properties/farm-house permanent;
rewrite ^/gulberggreen-farmhouses/?$ /properties/farm-house permanent;
rewrite ^/houses-for-sale/?$ /properties/house permanent;
rewrite ^/plots-for-sale/?$ /properties/plots permanent;
rewrite ^/apartment-for-sale/?$ /properties/flat permanent;
rewrite ^/apartments-for-rent-in-gulberg/?$ /properties/flat permanent;
rewrite ^/properties/apartment-for-rent/?$ /properties/flat permanent;
rewrite ^/properties/house-for-sale/?$ /properties/house permanent;
rewrite ^/properties/block-.+/?$ /properties permanent;
rewrite ^/properties/gulberg-.+/?$ /properties permanent;

rewrite ^/instalment-plan/?$ /installment-plan permanent;

rewrite ^/maps/?$ /gulberg-map permanent;

rewrite ^/news/?$ /latest-updates permanent;

rewrite ^/how-to-get-plot/?$ /latest-updates permanent;
rewrite ^/latest-updates-of-gulberg/?$ /latest-updates permanent;
rewrite ^/latest-meeting-of-society-gulberg-green-islamabad/?$ /latest-updates permanent;

rewrite ^/house-for-sale-in-gulberg-gre/?$ /properties/house permanent;
rewrite ^/favorite-properties/?$ /properties permanent;

rewrite ^/home/?$ / permanent;

rewrite ^/listing-form/?$ /properties permanent;
rewrite ^/listing/?$ /properties permanent;
rewrite ^/listing/.+/?$ /properties permanent;

rewrite ^/listing-category/plot/?$ /properties/plots permanent;
rewrite ^/listing-category/plot-for-sale/?$ /properties/plots permanent;
rewrite ^/listing-category/house-for-sale/?$ /properties/house permanent;
rewrite ^/listing-category/[^/]+/?$ /properties permanent;

rewrite ^/property/page/\d+/?$ /properties permanent;
rewrite ^/property/([^/]+)/?$ /properties/$1 permanent;

rewrite ^/agent/?$ / permanent;
rewrite ^/commercial/?$ /properties/commercial-plots permanent;
rewrite ^/es_amenity/[^/]+/?$ / permanent;

rewrite ^/contact-us/?$ /contact permanent;
