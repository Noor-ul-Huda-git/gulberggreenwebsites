# Optional: sudo cp deploy/nginx-rate-limit-zones.example.conf /etc/nginx/conf.d/gulberg-rate-limit.conf
# then nginx -t && sudo systemctl reload nginx
#
# Zones used by Gulberg site snippets (e.g. limit_req zone=gulberg_admin in location /admin/).

limit_req_zone $binary_remote_addr zone=gulberg_admin:10m rate=20r/m;
