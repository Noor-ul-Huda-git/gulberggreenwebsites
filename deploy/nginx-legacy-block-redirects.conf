# Legacy single-letter / shorthand block codes → block-* slugs (HTTP 301).
# Include inside nginx `server { ... }` AFTER `nginx-legacy-301-rewrites.conf`, BEFORE trailing-slash rules.
#
#   include /FULL/PATH/TO/repo/deploy/nginx-legacy-block-redirects.conf;

# --- farm-house ---
rewrite ^/properties/farm-house/A/(.+)$ /properties/farm-house/block-a/$1 permanent;
rewrite ^/properties/farm-house/A/?$ /properties/farm-house/block-a/ permanent;
rewrite ^/properties/farm-house/B/(.+)$ /properties/farm-house/block-b/$1 permanent;
rewrite ^/properties/farm-house/B/?$ /properties/farm-house/block-b/ permanent;
rewrite ^/properties/farm-house/C/(.+)$ /properties/farm-house/block-c/$1 permanent;
rewrite ^/properties/farm-house/C/?$ /properties/farm-house/block-c/ permanent;
rewrite ^/properties/farm-house/D/(.+)$ /properties/farm-house/block-d/$1 permanent;
rewrite ^/properties/farm-house/D/?$ /properties/farm-house/block-d/ permanent;
rewrite ^/properties/farm-house/E/(.+)$ /properties/farm-house/block-e/$1 permanent;
rewrite ^/properties/farm-house/E/?$ /properties/farm-house/block-e/ permanent;
rewrite ^/properties/farm-house/F/(.+)$ /properties/farm-house/block-f/$1 permanent;
rewrite ^/properties/farm-house/F/?$ /properties/farm-house/block-f/ permanent;
rewrite ^/properties/farm-house/J/(.+)$ /properties/farm-house/block-j/$1 permanent;
rewrite ^/properties/farm-house/J/?$ /properties/farm-house/block-j/ permanent;
rewrite ^/properties/farm-house/P2/(.+)$ /properties/farm-house/block-p2/$1 permanent;
rewrite ^/properties/farm-house/P2/?$ /properties/farm-house/block-p2/ permanent;
rewrite ^/properties/farm-house/Ext\.?/(.+)$ /properties/farm-house/block-ext/$1 permanent;
rewrite ^/properties/farm-house/Ext\.?/?$ /properties/farm-house/block-ext/ permanent;

