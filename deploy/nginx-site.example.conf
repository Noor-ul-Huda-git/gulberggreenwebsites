server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gulberggreens.com.pk www.gulberggreens.com.pk;

    # ssl_certificate     /etc/letsencrypt/live/gulberggreens.com.pk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gulberggreens.com.pk/privkey.pem;

    # === Edit: absolute path to this repo on the server ===
    # __REPO_ROOT__ = e.g. /var/www/gulbergGreenWebsite
    include __REPO_ROOT__/deploy/nginx-legacy-301-rewrites.conf;
    include __REPO_ROOT__/deploy/nginx-legacy-block-redirects.conf;
    include __REPO_ROOT__/deploy/nginx-trailing-slash.conf;

    # Django collected static (admin UI). __REPO_ROOT__/backend/staticfiles after collectstatic.
    location /static/ {
        alias __REPO_ROOT__/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Uploaded files (DJANGO_DEBUG=False — Django does not serve MEDIA_ROOT).
    location /media/ {
        alias __REPO_ROOT__/backend/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin (`path('admin/', ...)`). Must be above `location /` or the SPA consumes /admin.
    location = /admin {
        return 301 $scheme://$host/admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    include __REPO_ROOT__/deploy/nginx-static-cache.conf;

    # Built Vite app (npm run build). Large PDFs live under /maps/… from dist.
    location / {
        root __DIST_ROOT__;
        try_files $uri $uri/ /index.html;
    }
}

# __GUNICORN_UPSTREAM__ — use 127.0.0.1:8000 or unix socket to match your Gunicorn bind.
