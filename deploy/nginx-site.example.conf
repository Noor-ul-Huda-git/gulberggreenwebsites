# Example HTTPS server block for Gulberg Greens (SPA + Django API).
#
# 1) Copy and edit paths:
#    sudo cp deploy/nginx-site.example.conf /etc/nginx/sites-available/gulberggreens.conf
# 2) Replace __REPO_ROOT__, __DIST_ROOT__, __GUNICORN_UPSTREAM__ (see comments below).
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# The line `include ... nginx-legacy-301-rewrites.conf` MUST stay inside `server { }` and ABOVE
# `location / { try_files ... /index.html }` so old URLs 301 before the SPA shell.

# Upstream to Gunicorn (pick one style and delete the other from your real file).
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# upstream gulberg_django {
#     server unix:/run/gunicorn/gulberg.sock fail_timeout=0;
# }
# OR: server 127.0.0.1:8000;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gulberggreens.com.pk www.gulberggreens.com.pk;

    # ssl_certificate     /etc/letsencrypt/live/gulberggreens.com.pk/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gulberggreens.com.pk/privkey.pem;

    # === Edit: absolute path to this repo on the server ===
    # __REPO_ROOT__ = e.g. /var/www/gulbergGreenWebsite
    include __REPO_ROOT__/deploy/nginx-legacy-301-rewrites.conf;

    # Django collected static (admin UI). __REPO_ROOT__/backend/staticfiles after collectstatic.
    location /static/ {
        alias __REPO_ROOT__/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Built Vite app (npm run build). Large PDFs live under /maps/… from dist.
    location / {
        root __DIST_ROOT__;
        try_files $uri $uri/ /index.html;
    }
}

# __GUNICORN_UPSTREAM__ — use 127.0.0.1:8000 or unix socket to match your Gunicorn bind.
