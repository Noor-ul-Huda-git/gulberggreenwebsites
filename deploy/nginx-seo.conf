# Gulberg Greens — SEO routing (paste into your site `server { ... }` or include with `include /path/to/nginx-seo.conf;`).
# Adjust upstream/socket to match your Django app.
#
# Why: If the CDN/nginx sends every unknown path to the React `index.html`, `/sitemap.xml` and `/robots.txt`
# will show the homepage. Those two URLs must be served by Django (this repo already implements them).
#
# Django admin / Jazzmin: With DJANGO_DEBUG=false, CSS/JS live under `/static/`. If your `location /`
# serves the SPA `try_files ... /index.html`, then `/static/...` must be handled *before* that fallback
# or every admin page loads unstyled (404 HTML for .css). After deploy run:
#   cd /path/to/backend && python manage.py collectstatic --noinput

# --- Django collected static (admin, DRF browsable API, Jazzmin, CKEditor) ---
# Prefer this `alias` so nginx serves files directly (fast). Put it above your SPA `location /`.
# location /static/ {
#     alias /path/to/gulbergGreenWebsite/backend/staticfiles/;
#     access_log off;
#     expires 30d;
#     add_header Cache-Control "public, max-age=2592000";
# }
#
# Alternative: proxy `/static/` to Gunicorn — WhiteNoise in Django will serve from STATIC_ROOT.
# location /static/ {
#     proxy_pass http://127.0.0.1:8000;
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }

