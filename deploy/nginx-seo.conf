# Gulberg Greens — SEO routing (reference for production nginx).
# Adjust upstream/socket to match your Django app.
#
# Why: If nginx sends every unknown path to the React `index.html`, `/sitemap.xml` and `/robots.txt`
# will show the homepage. Those two URLs must be served by Django (this repo implements them).
#
# Django admin / Jazzmin: With DJANGO_DEBUG=false, CSS/JS live under `/static/`. If your `location /`
# serves the SPA `try_files ... /index.html`, then `/static/...` must be handled *before* that fallback
# or admin loads unstyled. After deploy run:
#   cd /path/to/backend && python manage.py collectstatic --noinput

# =============================================================================
# Legacy 301 redirects (Search Console old URLs)
# =============================================================================
# Source of truth:
#   deploy/nginx-legacy-301-rewrites.conf      — static legacy URLs
#   deploy/nginx-legacy-block-redirects.conf   — short block codes (e.g. /properties/farm-house/A/)
#   deploy/nginx-trailing-slash.conf           — extensionless paths → trailing slash
# (Django mirrors these in `config/seo_redirects.py` + `config/legacy_block_redirect_data.py`.)
# Inside `server { ... }`, ABOVE `location /` try_files, add EITHER:
#
#   include /FULL/PATH/TO/gulbergGreenWebsite/deploy/nginx-legacy-301-rewrites.conf;
#   include /FULL/PATH/TO/gulbergGreenWebsite/deploy/nginx-legacy-block-redirects.conf;
#   include /FULL/PATH/TO/gulbergGreenWebsite/deploy/nginx-trailing-slash.conf;
#
# OR run once on the server:
#
#   sudo ./deploy/install-nginx-redirects.sh --install
#   # then inside server {}
#   include snippets/gulberg-legacy-301.conf;
#
# Full example site: `deploy/nginx-site.example.conf`
# =============================================================================

