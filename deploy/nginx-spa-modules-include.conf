# ES modules (*.mjs) — strict MIME in browsers + pdf.js worker.
# Included inside each SPA server{} before `location /`.
#
# Paths: EDIT `root` if your dist directory is elsewhere.
#
location ~* ^/assets/.*\.mjs$ {
    root /home/ubuntu/gulbergGreenWebsite/frontend/dist;
    types { application/javascript mjs; }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    try_files $uri =404;
}
