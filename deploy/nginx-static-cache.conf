# Substitute __REPO_ROOT__ when deploying (same as nginx-site.example.conf).
# Hashed JS/CSS/fonts from Vite build — safe to cache immutably.
location ^~ /assets/ {
    root __REPO_ROOT__/frontend/dist;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# ES modules (*.mjs) — strict MIME for pdf.js worker.
location ~* ^/assets/.*\.mjs$ {
    root __REPO_ROOT__/frontend/dist;
    types { application/javascript mjs; }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Homepage / marketing images (public/images → dist/images).
location ^~ /images/ {
    root __REPO_ROOT__/frontend/dist;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}

# Large map PDFs — long cache, range-friendly.
location ^~ /maps/ {
    alias __REPO_ROOT__/frontend/dist/maps/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
}

# SPA shell — always revalidate so deploys propagate.
location = /index.html {
    root __REPO_ROOT__/frontend/dist;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
