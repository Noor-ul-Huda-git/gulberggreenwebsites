# Canonical trailing slash for extensionless public URLs (HTTP 301).
# Include AFTER legacy 301 rewrites, BEFORE `location /` try_files.
#
# Skips: /api, /admin, /static, /media, /assets, sitemap.xml, robots.txt, and paths with a file extension.

rewrite ^/(?!api(?:/|$)|admin(?:/|$)|static(?:/|$)|media(?:/|$)|assets(?:/|$)|sitemap\.xml$|robots\.txt$)([^.?]*[^/])$ /$1/ permanent;
