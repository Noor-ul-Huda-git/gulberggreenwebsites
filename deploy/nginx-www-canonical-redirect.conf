# Redirect www to apex (non-www). Include this BEFORE the main HTTPS server block.
# Cert paths must match your Let's Encrypt certificate (same cert usually covers both names).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.gulberggreens.com.pk;

    ssl_certificate     /etc/letsencrypt/live/gulberggreens.com.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gulberggreens.com.pk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://gulberggreens.com.pk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.gulberggreens.com.pk;

    return 301 https://gulberggreens.com.pk$request_uri;
}
