# Optional bare-Elastic-IP handlers: redirect IP-only browsers to HTTPS on the canonical host.
# Add these `server {}` blocks in the same nginx `http {}` scope as your main site (typically
# after the main HTTPS vhost). Requires a cert for :443 default_server (e.g. self-signed SAN=IP).

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl-gulberg-ip/ip.crt;
    ssl_certificate_key /etc/nginx/ssl-gulberg-ip/ip.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://gulberggreens.com.pk$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://gulberggreens.com.pk$request_uri;
}
